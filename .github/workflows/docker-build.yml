name: Build Flux Panel Channels

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: flux-panel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/ilambco/flux-panel-frontend
  BACKEND_IMAGE: ghcr.io/ilambco/flux-panel-backend

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate install scripts
        run: bash -n install.sh panel_install.sh

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache-dependency-path: |
            go-gost/go.sum
            go-gost/x/go.sum

      - name: Test node control modules
        working-directory: go-gost/x
        run: |
          set +e
          test_output=$(go test -mod=readonly ./forwarder ./trafficcounter ./realm ./service ./socket 2>&1)
          test_status=$?
          set -e
          printf '%s\n' "$test_output"
          if [ "$test_status" -ne 0 ]; then
            annotation=${test_output//'%'/'%25'}
            annotation=${annotation//$'\r'/'%0D'}
            annotation=${annotation//$'\n'/'%0A'}
            echo "::error title=Go test failed::$annotation"
            exit "$test_status"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: vite-frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: springboot-backend/pom.xml

      - name: Build backend
        working-directory: springboot-backend
        run: |
          mvn --batch-mode -Dtest=FlowBillingUtilTests test
          mvn --batch-mode package -DskipTests

  build-agent:
    name: Build node agent
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache-dependency-path: |
            go-gost/go.sum
            go-gost/x/go.sum

      - name: Build Linux binaries
        working-directory: go-gost
        run: |
          mkdir -p ../artifacts
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../artifacts/gost-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../artifacts/gost-arm64
          cd ../artifacts
          sha256sum gost-* > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: node-agent
          path: artifacts/
          if-no-files-found: error

  build-images:
    name: Build ${{ matrix.name }} image
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: vite-frontend
            image: ghcr.io/ilambco/flux-panel-frontend
          - name: backend
            context: springboot-backend
            image: ghcr.io/ilambco/flux-panel-backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish-channel:
    name: Publish channel files
    needs:
      - build-agent
      - build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: node-agent
          path: artifacts

      - name: Publish channel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel_tag="channel-${GITHUB_REF_NAME}"
          if ! gh release view "$channel_tag" >/dev/null 2>&1; then
            prerelease_args=()
            if [ "$GITHUB_REF_NAME" = "develop" ]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$channel_tag" --target "$GITHUB_SHA" --title "${GITHUB_REF_NAME} channel" "${prerelease_args[@]}" --notes "Automatically updated deployment channel."
          fi
          gh release upload "$channel_tag" \
            artifacts/gost-amd64 \
            artifacts/gost-arm64 \
            artifacts/SHA256SUMS \
            install.sh \
            panel_install.sh \
            docker-compose-v4.yml \
            docker-compose-v6.yml \
            gost.sql \
            --clobber
